name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python 3.13 / ${{ matrix.os }} / CPU
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned to a release. "ubuntu-latest" moved to a new image on its own
        # and changed the preinstalled browsers and the package mirrors under the tests.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ANONYMIZED_TELEMETRY: 'False'
      OMP_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      PIP_RETRIES: '5'
      PIP_DEFAULT_TIMEOUT: '60'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install CPU dependencies
        timeout-minutes: 12
        run: |
          python -m pip install --only-binary=:all: -r requirements/torch-cpu.txt
          python -m pip install --only-binary=:all: -r requirements/dev.txt
          python -m pip check
      - name: Compile every Python source
        # Scripts and tools that no test imports would otherwise ship with syntax errors.
        run: python -m compileall -q *.py tools tests benchmarks
      - name: Python regression tests (fake vectors, models and sensors)
        timeout-minutes: 10
        run: |
          mkdir -p reports
          python -m unittest discover -s tests -t . -v 2>&1 | tee reports/unit-tests.log
      - name: Frontend tests and launcher syntax
        run: |
          node --test tests/frontend/*.test.mjs
          for module in dist/*.js; do node --check "$module"; done
          bash -n configurar.sh
          bash -n web.sh
      - name: Select a browser for acceptance tests
        id: browser
        # Runner images ship Chrome and Edge. Using one of them needs no package mirror
        # and no browser download, the two network steps that broke this job before.
        run: |
          choose() {
            echo "channel=$1" >> "$GITHUB_OUTPUT"
            echo "RAG_BROWSER_CHANNEL=$2" >> "$GITHUB_ENV"
            echo "Browser for acceptance tests: $1 ($3)"
          }
          if [ "$RUNNER_OS" = "Windows" ]; then
            for candidate in \
              "msedge|/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" \
              "msedge|/c/Program Files/Microsoft/Edge/Application/msedge.exe" \
              "chrome|/c/Program Files/Google/Chrome/Application/chrome.exe"; do
              if [ -f "${candidate#*|}" ]; then
                choose "${candidate%%|*}" "${candidate%%|*}" "${candidate#*|}"
                exit 0
              fi
            done
          else
            for candidate in "chrome|google-chrome" "chrome|google-chrome-stable" \
                             "msedge|microsoft-edge" "msedge|microsoft-edge-stable"; do
              if command -v "${candidate#*|}" >/dev/null 2>&1; then
                choose "${candidate%%|*}" "${candidate%%|*}" "$("${candidate#*|}" --version 2>/dev/null || echo "${candidate#*|}")"
                exit 0
              fi
            done
          fi
          choose bundled chromium "no system browser found; Playwright Chromium will be downloaded"
      - name: Download Playwright Chromium (only when the image has no browser)
        if: steps.browser.outputs.channel == 'bundled'
        timeout-minutes: 12
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: |
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::Attempt $attempt failed: $*"
              sleep $((attempt * 20))
            done
            return 1
          }
          if [ "$RUNNER_OS" = "Linux" ]; then
            printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
              | sudo tee /etc/apt/apt.conf.d/80-rag-ci-network >/dev/null
            retry python -m playwright install-deps chromium 2>&1 | tee reports/browser-dependencies.log
          fi
          retry python -m playwright install chromium 2>&1 | tee reports/browser-install.log
      - name: Browser acceptance tests (isolated corpus, no inference)
        timeout-minutes: 12
        run: python -m tests.browser.qa_redesign 2>&1 | tee reports/browser-tests.log
      - name: Summarize results
        if: always()
        run: |
          unit=$(grep -E '^Ran [0-9]+ tests' reports/unit-tests.log 2>/dev/null | tail -n 1 || true)
          verdict=$(tail -n 1 reports/unit-tests.log 2>/dev/null || true)
          checks=$(grep -c '^OK: ' reports/browser-tests.log 2>/dev/null || true)
          {
            echo "### ${{ matrix.os }}"
            echo "- Python tests: ${unit:-did not run} ${verdict}"
            echo "- Browser acceptance (${RAG_BROWSER_CHANNEL:-no browser selected}): ${checks:-0} checks passed"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  dependency-graph:
    name: Publish declared dependency profiles
    needs: offline-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build an exact declared-pin snapshot
        run: python -m tools.dependency_snapshot --sha "$GITHUB_SHA" --job-id "$GITHUB_RUN_ID" --output reports/dependency-snapshot.json
      - name: Submit profiles to the dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/dependency-graph/snapshots" --input reports/dependency-snapshot.json
